<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的方塊簡譜</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f4f4f2;--panel:#fff;--ink:#222;--line:#d9d9d9;--cell:22px}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0}
button{font:inherit;padding:6px 12px;border:1px solid #bbb;border-radius:6px;background:#fff;cursor:pointer}
button:hover{background:#eee}
main{flex:1;display:flex;min-height:0}
aside{width:170px;overflow:auto;padding:14px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
aside h2{font-size:14px;margin:0 0 4px;color:#666}
.tool{display:flex;align-items:center;gap:8px;text-align:left}
.tool.on{outline:2px solid #4a90e2;background:#eef5ff}
.sw{width:18px;height:18px;border:1px solid #888;display:inline-block}
.tool small{margin-left:auto;color:#888}
aside label{font-size:13px;display:flex;justify-content:space-between;align-items:center}
aside input[type=number]{width:52px}
#wrap{flex:1;overflow:auto;padding:20px}
#sheet{display:inline-block;background:#fff;padding:14px;border:1px solid var(--line)}
.row{display:flex;gap:14px;margin-bottom:14px;align-items:center}
.box{display:grid;grid-template-columns:repeat(5,var(--cell));grid-template-rows:repeat(3,var(--cell));border:2px solid #000;background:#fff;touch-action:none}
.c{border:1px solid #e6e6e6;width:var(--cell);height:var(--cell)}
.c[data-v="1"]{background:#000}.c[data-v="2"]{background:#f00}.c[data-v="3"]{background:#1ba7e6}
.rm{opacity:.35;padding:2px 6px}.rm:hover{opacity:1}
#bar{margin-top:6px;display:flex;gap:8px}
</style>
</head>
<body>
<header>
  <h1>♫ 我的方塊簡譜</h1>
  <div><button id="pdf">匯出 PDF</button> <button id="jpg">匯出 JPG</button></div>
</header>
<main>
  <aside>
    <h2>工具</h2>
    <button class="tool" data-t="1"><span class="sw" style="background:#000"></span>黑色<small>1</small></button>
    <button class="tool" data-t="2"><span class="sw" style="background:#f00"></span>紅色<small>2</small></button>
    <button class="tool" data-t="3"><span class="sw" style="background:#1ba7e6"></span>藍色<small>3</small></button>
    <button class="tool" data-t="0"><span class="sw" style="background:#fff"></span>橡皮擦<small>4</small></button>
    <h2 style="margin-top:12px">版面</h2>
    <label>每列譜數 <input type="number" id="cols" min="1" max="12" value="6"></label>
    <button id="clear">清空全部</button>
    <h2 style="margin-top:12px">自動生成</h2>
    <button id="skyBtn">匯入光遇譜 .txt</button>
    <button id="ptBtn">貼上簡譜文字</button>
    <input type="file" id="skyFile" accept=".txt,.json" hidden>
    <label>每方塊 ms <input type="number" id="unit" min="10" placeholder="自動"></label>
    <div style="font-size:12px;color:#666">層次→顏色</div>
    <label>僅第1層 <select id="m1"><option value="1">黑</option><option value="2">紅</option><option value="3">藍</option></select></label>
    <label>僅第2層 <select id="m2"><option value="1">黑</option><option value="2" selected>紅</option><option value="3">藍</option></select></label>
    <label>僅第3層 <select id="m3"><option value="1">黑</option><option value="2">紅</option><option value="3" selected>藍</option></select></label>
    <button id="trimBtn">刪除空白方塊</button>
    <button id="undoBtn" hidden>復原</button>
    <span id="msg" style="font-size:12px;color:#c33"></span>
    <p style="font-size:12px;color:#888;margin:6px 0 0">點一下或拖曳塗色；對同色格再點一次可擦除。</p>
  </aside>
  <div id="wrap">
    <div id="sheet"></div>
    <div id="bar"><button id="addRow">＋ 向下新增一列</button></div>
  </div>
</main>
<dialog id="pt">
  <h3 style="margin:0 0 8px">貼上譜文字（自動辨識格式）</h3>
  <p style="font-size:12.5px;margin:0 0 8px;line-height:1.6">支援：<br>
  ① Sky Studio JSON（.txt 內容）<br>
  ② 方格文字：<code>. . A1A3B1 . B4</code>（A/B/C＝上/中/下排，1–5＝左到右，<b>.</b>＝休止）<br>
  ③ 數字＋字母：<code>6 15 j 10 14 l d</code>（數字＝鍵 1–15，字母＝節拍）<br>
  ④ 數字簡譜：<code>1 3+5 0 6' 2'+4'</code>（空格＝一個方塊，<b>+</b>和弦，<b>0</b>休止，<b>'</b>高八度，<b>,</b>低八度）</p>
  <label style="font-size:13px">格式 <select id="fmt"><option value="auto">自動</option><option value="jp">數字簡譜</option><option value="nl">數字＋字母</option></select></label>
  <label style="font-size:13px;margin-left:8px">④ 無記號的 1 = 第 <input type="number" id="base" min="0" max="14" value="0" style="width:48px"> 鍵</label>
  <textarea id="ptText" rows="9" style="width:100%;font-size:14px"></textarea>
  <label style="font-size:13px;display:block;margin-top:6px">③ 字母佔幾格（字母=格數，逗號分隔）
    <input id="letters" value="j=2,l=1,d=1,g=2" style="width:100%"></label>
  <div style="font-size:12px;color:#666">數字後接字母＝該和弦佔幾格；單獨的字母＝休止幾格。</div>
  <div style="margin-top:10px;text-align:right"><button id="ptCancel">取消</button> <button id="ptGo">產生</button></div>
</dialog>

<script>
const W=5,H=3,KEY='fangkuai-score-v1';
let tool=1,cols=6,rows=[],painting=false,paintVal=1;
const newBox=()=>Array(W*H).fill(0);
const newRow=()=>Array.from({length:cols},newBox);
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.rows){rows=s.rows;cols=s.cols}}catch(e){}
if(!rows.length)rows=[newRow(),newRow(),newRow(),newRow()];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({cols,rows}))}catch(e){}};

function render(){
  const sh=document.getElementById('sheet');sh.innerHTML='';
  rows.forEach((row,r)=>{
    const rd=document.createElement('div');rd.className='row';
    row.forEach((box,b)=>{
      const bd=document.createElement('div');bd.className='box';
      box.forEach((v,i)=>{
        const c=document.createElement('div');c.className='c';c.dataset.v=v;
        c.dataset.r=r;c.dataset.b=b;c.dataset.i=i;bd.appendChild(c);
      });
      rd.appendChild(bd);
    });
    const x=document.createElement('button');x.className='rm';x.textContent='✕';x.title='刪除此列';
    x.onclick=()=>{if(rows.length>1){rows.splice(r,1);save();render()}};
    rd.appendChild(x);sh.appendChild(rd);
  });
  document.getElementById('cols').value=cols;
}
function apply(el,val){
  if(!el||!el.classList||!el.classList.contains('c'))return;
  const {r,b,i}=el.dataset;rows[r][b][i]=val;el.dataset.v=val;
}
const sheet=document.getElementById('sheet');
sheet.addEventListener('pointerdown',e=>{
  const el=e.target;if(!el.classList.contains('c'))return;
  painting=true;
  paintVal=(+el.dataset.v===tool)?0:tool;
  apply(el,paintVal);e.preventDefault();
});
sheet.addEventListener('pointermove',e=>{
  if(!painting)return;
  apply(document.elementFromPoint(e.clientX,e.clientY),paintVal);
});
addEventListener('pointerup',()=>{if(painting){painting=false;save()}});

function setTool(t){
  tool=t;
  document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('on',+b.dataset.t===t));
}
document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>setTool(+b.dataset.t));
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  const m={'1':1,'2':2,'3':3,'4':0,'0':0};
  if(e.key in m)setTool(m[e.key]);
});
setTool(1);

document.getElementById('addRow').onclick=()=>{rows.push(newRow());save();render()};
document.getElementById('clear').onclick = () => {
    if (!confirm('確定清空全部樂譜？')) return;

    rows.forEach((row, index) => {
        rows[index] = newRow();
    });

    rows.splice(1);

    save();
    render();
};
document.getElementById('cols').onchange=e=>{
  const n=Math.max(1,Math.min(12,+e.target.value||6));
  rows=rows.map(r=>{const a=r.slice(0,n);while(a.length<n)a.push(newBox());return a});
  cols=n;save();render();
};

// ---- 匯出（只輸出譜面）----
const COLORS=['#fff','#000','#f00','#1ba7e6'];
function drawCanvas(){
  const S=36,G=20,PAD=24,BW=W*S,BH=H*S;
  const cv=document.createElement('canvas');
  cv.width=PAD*2+cols*BW+(cols-1)*G;
  cv.height=PAD*2+rows.length*BH+(rows.length-1)*G;
  const g=cv.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);
  rows.forEach((row,r)=>row.forEach((box,b)=>{
    const ox=PAD+b*(BW+G),oy=PAD+r*(BH+G);
    g.fillStyle='#fff';g.fillRect(ox,oy,BW,BH);
    g.strokeStyle='#ddd';g.lineWidth=1;
    for(let i=1;i<W;i++){g.beginPath();g.moveTo(ox+i*S,oy);g.lineTo(ox+i*S,oy+BH);g.stroke()}
    for(let j=1;j<H;j++){g.beginPath();g.moveTo(ox,oy+j*S);g.lineTo(ox+BW,oy+j*S);g.stroke()}
    box.forEach((v,i)=>{
      if(!v)return;
      g.fillStyle=COLORS[v];g.fillRect(ox+(i%W)*S,oy+Math.floor(i/W)*S,S,S);
    });
    g.strokeStyle='#000';g.lineWidth=2;g.strokeRect(ox,oy,BW,BH);
  }));
  return cv;
}
function download(url,name){const a=document.createElement('a');a.href=url;a.download=name;a.click()}
document.getElementById('jpg').onclick=()=>download(drawCanvas().toDataURL('image/jpeg',0.95),'方塊簡譜.jpg');
document.getElementById('pdf').onclick = () => {

    const { jsPDF } = window.jspdf;

    const ROWS_PER_PAGE = 80;

    const S = 36;
    const G = 20;
    const PAD = 24;

    const BW = W * S;
    const BH = H * S;

    const pageRows = [];

    for (let i = 0; i < rows.length; i += ROWS_PER_PAGE) {
        pageRows.push(rows.slice(i, i + ROWS_PER_PAGE));
    }

    const pdf = new jsPDF({
        orientation: 'p',
        unit: 'px'
    });

    pageRows.forEach((pageData, pageIndex) => {

        const cv = document.createElement('canvas');

        cv.width =
            PAD * 2 +
            cols * BW +
            (cols - 1) * G;

        cv.height =
            PAD * 2 +
            pageData.length * BH +
            (pageData.length - 1) * G;

        const g = cv.getContext('2d');

        g.fillStyle = '#fff';
        g.fillRect(0, 0, cv.width, cv.height);

        pageData.forEach((row, r) => {

            row.forEach((box, b) => {

                const ox = PAD + b * (BW + G);
                const oy = PAD + r * (BH + G);

                g.fillStyle = '#fff';
                g.fillRect(ox, oy, BW, BH);

                g.strokeStyle = '#ddd';
                g.lineWidth = 1;

                for (let i = 1; i < W; i++) {
                    g.beginPath();
                    g.moveTo(ox + i * S, oy);
                    g.lineTo(ox + i * S, oy + BH);
                    g.stroke();
                }

                for (let j = 1; j < H; j++) {
                    g.beginPath();
                    g.moveTo(ox, oy + j * S);
                    g.lineTo(ox + BW, oy + j * S);
                    g.stroke();
                }

                box.forEach((v, i) => {

                    if (!v) return;

                    g.fillStyle = COLORS[v];

                    g.fillRect(
                        ox + (i % W) * S,
                        oy + Math.floor(i / W) * S,
                        S,
                        S
                    );

                });

                g.strokeStyle = '#000';
                g.lineWidth = 2;
                g.strokeRect(ox, oy, BW, BH);

            });

        });

        const img = cv.toDataURL('image/jpeg', 0.95);

        if (pageIndex > 0) {
            pdf.addPage([cv.width, cv.height], 'p');
        }

        pdf.addImage(
            img,
            'JPEG',
            0,
            0,
            cv.width,
            cv.height
        );

    });

    pdf.save('方塊簡譜.pdf');

};

// ---- 自動生成 ----
const $=id=>document.getElementById(id),msg=t=>$('msg').textContent=t||'';
const hasContent=()=>rows.some(r=>r.some(b=>b.some(v=>v)));
function fillBoxes(slots){
  if(hasContent()&&!confirm('會取代目前的樂譜，確定嗎？'))return false;
  const n=Math.max(1,Math.ceil(slots.length/cols));
  rows=Array.from({length:n},newRow);
  slots.forEach((c,i)=>{rows[Math.floor(i/cols)][i%cols]=c});
  save();render();return true;
}
function readText(buf){
  const u=new Uint8Array(buf);let enc='utf-8';
  if(u[0]===0xFF&&u[1]===0xFE)enc='utf-16le';else if(u[0]===0xFE&&u[1]===0xFF)enc='utf-16be';
  return new TextDecoder(enc).decode(buf).replace(/^\uFEFF/,'');
}
let sky=null;
$('skyBtn').onclick=()=>$('skyFile').click();
$('skyFile').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{importAny(readText(await f.arrayBuffer()))}catch(err){msg('讀取失敗：'+err.message)}
  e.target.value='';
};
$('ptBtn').onclick=()=>$('pt').showModal();
$('ptCancel').onclick=()=>$('pt').close();
$('ptGo').onclick=()=>{
  try{importAny($('ptText').value);$('pt').close()}catch(err){msg('讀取失敗：'+err.message);$('pt').close()}
};
function importAny(raw){
  const t=raw.replace(/^\s*```.*$/gm,'').trim();
  if(!t)throw new Error('內容是空的');
  if(/^[\[{]/.test(t)){
    let d;try{d=JSON.parse(t)}catch(e){throw new Error('JSON 格式有誤')}
    if(Array.isArray(d)&&d.length&&d.every(x=>typeof x==='number'))
      throw new Error('純數字陣列的對應規則不明，無法轉換');
    if(Array.isArray(d))d=d[0];
    if(!d||d.isEncrypted)throw new Error('此譜已加密或格式不明');
    if(!Array.isArray(d.songNotes))throw new Error('不是光遇譜格式');
    sky=d;$('unit').value='';convertSky();return;
  }
  const toks=t.split(/[\s|]+/).filter(Boolean);sky=null;
  const gridRe=/^(?:[.\-_]+|(?:[A-C][1-5])+)$/i;
  if(toks.filter(x=>gridRe.test(x)).length/toks.length>0.8){
    const slots=toks.map(x=>{
      const c=Array(15).fill(0);
      for(const m of x.matchAll(/([A-C])([1-5])/gi))c[(m[1].toUpperCase().charCodeAt(0)-65)*5+(+m[2]-1)]=1;
      return c;
    });
    if(fillBoxes(slots))msg('方格文字：已生成 '+slots.length+' 個方塊');
    return;
  }
  const jpRe=/^[0-7](?:'+|,+)?(?:\+[0-7](?:'+|,+)?)*$/,fmt=$('fmt').value;
  if(fmt==='jp'||(fmt==='auto'&&toks.every(x=>jpRe.test(x)))){
    const base=+$('base').value||0,bad=new Set(),slots=toks.map(tok=>{
      const c=Array(15).fill(0);
      tok.split('+').forEach(n=>{
        const x=/^([0-7])('*|,*)$/.exec(n);if(!x){bad.add(n);return}
        if(x[1]==='0')return;
        const o=x[2]?(x[2][0]==="'"?x[2].length:-x[2].length):0,i=base+(+x[1]-1)+7*o;
        if(i<0||i>14)bad.add(n);else c[i]=1;
      });
      return c;
    });
    if(fillBoxes(slots))msg('簡譜：已生成 '+slots.length+' 個方塊'+(bad.size?'；超出音域：'+[...bad].join(' '):''));
    return;
  }
  // 數字＋字母
  const map={};
  $('letters').value.split(',').forEach(p=>{const [k,v]=p.split('=');if(k&&+v>0)map[k.trim().toLowerCase()]=+v});
  const slots=[],bad=new Set();let cur=null;
  const rest=n=>{for(let i=0;i<n;i++)slots.push(newBox())};
  toks.forEach(x=>{
    if(/^\d+$/.test(x)){
      const k=+x-1;if(k<0||k>14){bad.add(x);return}
      (cur=cur||Array(15).fill(0))[k]=1;
    }else if(/^[a-z]$/i.test(x)){
      const n=map[x.toLowerCase()];if(!n){bad.add(x);return}
      if(cur){slots.push(cur);rest(n-1);cur=null}else rest(n);
    }else bad.add(x);
  });
  if(cur)slots.push(cur);
  if(!slots.length)throw new Error('無法辨識格式');
  if(fillBoxes(slots))msg('已生成 '+slots.length+' 個方塊'+(bad.size?'；略過：'+[...bad].join(' '):''));
}
$('unit').onchange=()=>{if(sky)convertSky()};
['m1','m2','m3'].forEach(i=>$(i).onchange=()=>{if(sky)convertSky()});
function convertSky(){
  const notes=sky.songNotes;
  let unit=+$('unit').value;
  if(!unit){ // 自動：取相鄰時間差的眾數
    const ts=[...new Set(notes.map(n=>n.time))].sort((a,b)=>a-b),cnt={};
    for(let i=1;i<ts.length;i++){const d=ts[i]-ts[i-1];cnt[d]=(cnt[d]||0)+1}
    unit=+Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]||250;
    $('unit').value=unit;
  }
  const col=[0,+$('m1').value,+$('m2').value,+$('m3').value];
  const m={};let max=0;
  notes.forEach(n=>{
    const x=/^(\d)Key(\d+)$/.exec(n.key);if(!x)return;
    const k=+x[2];if(k>14)return;
    const s=Math.round(n.time/unit);max=Math.max(max,s);
    (m[s]=m[s]||Array(15).fill(0))[k]|=(+x[1]===1?1:2);
  });
  const slots=[];
  for(let s=0;s<=max;s++)slots.push(m[s]?m[s].map(v=>col[v]):newBox());
  if(fillBoxes(slots))msg('已生成 '+slots.length+' 個方塊');
}
let backup=null;
$('trimBtn').onclick=()=>{
  const all=rows.flat(),kept=all.filter(b=>b.some(v=>v)),n=all.length-kept.length;
  if(!n){msg('沒有空白方塊');return}
  if(!kept.length){msg('整份都是空白，未刪除');return}
  backup=JSON.stringify({cols,rows});
  rows=Array.from({length:Math.ceil(kept.length/cols)},newRow);
  kept.forEach((b,i)=>{rows[Math.floor(i/cols)][i%cols]=b});
  save();render();msg('已刪除 '+n+' 個空白方塊');$('undoBtn').hidden=false;
};
$('undoBtn').onclick=()=>{
  if(!backup)return;const o=JSON.parse(backup);rows=o.rows;cols=o.cols;
  save();render();$('undoBtn').hidden=true;backup=null;msg('已復原');
};
render();
</script>
</body>
</html>
