<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Block Score</title>
<link rel="icon" type="image/png" sizes="512x512" href="./image.png">
<link rel="apple-touch-icon" sizes="512x512" href="./image.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f4f4f2;--panel:#fff;--ink:#222;--line:#d9d9d9;--cell:22px}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","Noto Sans JP",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100vh}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px 14px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0}
button{font:inherit;padding:6px 12px;border:1px solid #bbb;border-radius:6px;background:#fff;cursor:pointer}
button:hover{background:#eee}
main{flex:1;display:flex;min-height:0}
aside{width:210px;flex-shrink:0;overflow:auto;padding:14px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
aside h2{font-size:14px;margin:0 0 4px;color:#666}
.tool{display:flex;align-items:center;gap:8px;text-align:left}
.tool.on{outline:2px solid #4a90e2;background:#eef5ff}
.sw{width:18px;height:18px;border:1px solid #888;display:inline-block}
.tool small{margin-left:auto;color:#888}
aside label{font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:6px}
#langSel{font:inherit;font-size:13px;padding:5px 6px;border:1px solid #bbb;border-radius:6px;background:#fff;cursor:pointer}
aside input[type=number]{width:52px}
[hidden]{display:none!important}
.box.playing{outline:3px solid #f90;outline-offset:-3px}
.nslot.playing{background:#ffe9b8}
#wrap,#nwrap{flex:1;overflow:auto;padding:20px}
.tab.on{background:#4a90e2;color:#fff;border-color:#4a90e2}
#nsheet{display:inline-block;background:#fff;padding:14px 18px;border:1px solid var(--line)}
.nrow{position:relative;display:flex;margin:26px 0 12px;border-right:2px solid #000}
.nlab{position:absolute;top:-17px;left:0;font-size:12px;color:#666}
.nslot{width:50px;min-height:54px;padding:16px 0 4px;display:flex;flex-direction:column;align-items:center;cursor:pointer;user-select:none}
.nslot.bs{border-left:2px solid #000}
.nslot.sel{background:#e3f0ff;box-shadow:inset 0 0 0 2px #4a90e2}
.nt{position:relative;font-size:22px;line-height:30px;font-weight:600;white-space:nowrap}
.nt[data-d="1"]::before,.nt[data-d="2"]::before{content:'';position:absolute;top:1px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.nt[data-d="2"]::before{margin-left:-6px;box-shadow:8px 0 currentColor}
#keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.kp{padding:8px 0}.kp .nt{font-size:17px;line-height:22px;font-weight:600}.kp.on{background:#cfe3ff;border-color:#4a90e2}
.oct.on{background:#eef5ff;outline:2px solid #4a90e2}
#sheet{display:inline-block;background:#fff;padding:14px;border:1px solid var(--line)}
.row{display:flex;gap:14px;margin-bottom:14px;align-items:center}
.box{display:grid;grid-template-columns:repeat(5,var(--cell));grid-template-rows:repeat(3,var(--cell));border:2px solid #000;background:#fff;touch-action:none}
.c{border:1px solid #e6e6e6;width:var(--cell);height:var(--cell)}
.c[data-v="1"]{background:#000}.c[data-v="2"]{background:#f00}.c[data-v="3"]{background:#1ba7e6}
.rm{opacity:.35;padding:2px 6px}.rm:hover{opacity:1}
#bar{margin-top:6px;display:flex;gap:8px}
.fld{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.fld input:not([type=checkbox]),.fld select{width:58%}
#tx{min-width:360px}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:10px">
    <h1 data-i18n="appTitle"></h1>
    <select id="langSel" title="Language / 語言 / Ngôn ngữ / 言語" aria-label="Language">
      <option value="zh">🌐 繁體中文</option>
      <option value="en">🌐 English</option>
      <option value="vi">🌐 Tiếng Việt</option>
      <option value="ja">🌐 日本語</option>
    </select>
  </div>
  <div><button class="tab" id="tabSq" data-i18n="tabSq"></button> <button class="tab" id="tabNum" data-i18n="tabNum"></button></div>
  <div id="playBox" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
    <button id="playBtn" data-i18n="play"></button>
    <label style="font-size:13px">1 = <select id="pKey"><option value="0">C</option><option value="1">D♭</option><option value="2">D</option><option value="3">E♭</option><option value="4">E</option><option value="5">F</option><option value="6">G♭</option><option value="7">G</option><option value="8">A♭</option><option value="9">A</option><option value="10">B♭</option><option value="11">B</option></select></label>
    <select id="pInst" data-i18n-title="tInst"><option value="piano" data-i18n="iPiano"></option><option value="violin" data-i18n="iViolin"></option><option value="guitar" data-i18n="iGuitar"></option><option value="harp" data-i18n="iHarp"></option><option value="flute" data-i18n="iFlute"></option><option value="musicbox" data-i18n="iBox"></option></select>
    <select id="pSpd" data-i18n-title="tSpd"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
    <label style="font-size:12px" data-i18n-title="pSeqT"><input type="checkbox" id="pSeq" checked><span data-i18n="pSeq"></span></label>
  </div>
  <div><button id="pdf" data-i18n="ePdf"></button> <button id="jpg" data-i18n="eJpg"></button> <button id="txt" data-i18n="eTxt"></button></div>
</header>
<main>
  <aside>
    <div id="sqTools" style="display:flex;flex-direction:column;gap:8px">
    <h2 data-i18n="hTools"></h2>
    <button class="tool" data-t="1"><span class="sw" style="background:#000"></span><span data-i18n="toolK"></span><small>1</small></button>
    <button class="tool" data-t="2"><span class="sw" style="background:#f00"></span><span data-i18n="toolR"></span><small>2</small></button>
    <button class="tool" data-t="3"><span class="sw" style="background:#1ba7e6"></span><span data-i18n="toolB"></span><small>3</small></button>
    <button class="tool" data-t="0"><span class="sw" style="background:#fff"></span><span data-i18n="toolE"></span><small>4</small></button>
    </div>
    <div id="numTools" hidden style="display:flex;flex-direction:column;gap:8px">
    <h2 data-i18n="hNum"></h2>
    <label><span data-i18n="nPer"></span> <input type="number" id="nPer" min="1" max="16"></label>
    <label><span data-i18n="nBpr"></span> <input type="number" id="nBpr" min="1" max="8"></label>
    <label><span data-i18n="nStyle"></span> <select id="nStyle"><option value="dot" data-i18n="nsDot"></option><option value="tick">'1 ''1</option><option value="abc">A1–C1</option></select></label>
    <label><span data-i18n="nAuto"></span> <input type="checkbox" id="nAuto"></label>
    <div id="nPos" style="font-size:12px;color:#666"></div>
    <div id="keypad"></div>
    <div style="display:flex;gap:4px"><button class="oct on" data-o="0" style="flex:1">1–7</button><button class="oct" data-o="1" style="flex:1" data-i18n="oHigh"></button><button class="oct" data-o="2" style="flex:1" data-i18n="oHigher"></button></div>
    <div style="display:flex;gap:4px"><button id="nPrev" style="flex:1">←</button><button id="nNext" style="flex:1">→</button></div>
    <button id="nClear" data-i18n="nClear"></button>
    <button id="nIns" data-i18n="nIns"></button>
    <button id="nDel" data-i18n="nDel"></button>
    <p data-i18n="numHelp" style="font-size:12px;color:#888;margin:2px 0"></p>
    </div>
    <div id="shared" style="display:flex;flex-direction:column;gap:8px">
    <h2 style="margin-top:12px" data-i18n="hLayout"></h2>
    <label><span data-i18n="cols"></span> <input type="number" id="cols" min="1" max="12" value="6"></label>
    <button id="clear" data-i18n="clear"></button>
    </div>
    <h2 style="margin-top:12px" data-i18n="hAuto"></h2>
    <button id="skyBtn" data-i18n="skyBtn" data-i18n-title="skyBtnT"></button>
    <button id="ptBtn" data-i18n="ptBtn"></button>
    <input type="file" id="skyFile" accept=".txt,.json" hidden>
    <label><span data-i18n="unit"></span> <input type="number" id="unit" min="10" data-i18n-ph="auto"></label>
    <div style="font-size:12px;color:#666" data-i18n="layerCol"></div>
    <label><span data-i18n="m1"></span> <select id="m1"><option value="1" data-i18n="colK"></option><option value="2" data-i18n="colR"></option><option value="3" data-i18n="colB"></option></select></label>
    <label><span data-i18n="m2"></span> <select id="m2"><option value="1" data-i18n="colK"></option><option value="2" selected data-i18n="colR"></option><option value="3" data-i18n="colB"></option></select></label>
    <label><span data-i18n="m3"></span> <select id="m3"><option value="1" data-i18n="colK"></option><option value="2" data-i18n="colR"></option><option value="3" selected data-i18n="colB"></option></select></label>
    <button id="mergeBtn" data-i18n="merge" data-i18n-title="mergeT"></button>
    <button id="trimBtn" data-i18n="trim"></button>
    <button id="undoBtn" hidden data-i18n="undo"></button>
    <span id="msg" style="font-size:12px;color:#c33"></span>
    <p data-i18n="paintHelp" style="font-size:12px;color:#888;margin:6px 0 0"></p>
  </aside>
  <div id="nwrap" hidden><div id="nsheet"></div></div>
  <div id="wrap">
    <div id="sheet"></div>
    <div id="bar"><button id="addRow" data-i18n="addRow"></button></div>
  </div>
</main>
<dialog id="pt">
  <h3 style="margin:0 0 8px" data-i18n="ptTitle"></h3>
  <p style="font-size:12.5px;margin:0 0 8px;line-height:1.6" data-i18n-html="ptHelp"></p>
  <label style="font-size:13px"><span data-i18n="fmt"></span> <select id="fmt"><option value="auto" data-i18n="fmtAuto"></option><option value="jp" data-i18n="fmtJp"></option><option value="nl" data-i18n="fmtNl"></option></select></label>
  <label style="font-size:13px;margin-left:8px"><span data-i18n="basePre"></span> <input type="number" id="base" min="0" max="14" value="0" style="width:48px"> <span data-i18n="basePost"></span></label>
  <textarea id="ptText" rows="9" style="width:100%;font-size:14px"></textarea>
  <label style="font-size:13px;display:block;margin-top:6px"><span data-i18n="letters"></span>
    <input id="letters" value="j=2,l=1,d=1,g=2" style="width:100%"></label>
  <div style="font-size:12px;color:#666" data-i18n="lettersHint"></div>
  <div style="margin-top:10px;text-align:right"><button id="ptCancel" data-i18n="cancel"></button> <button id="ptGo" data-i18n="gen"></button></div>
</dialog>

<dialog id="tx">
  <h3 style="margin:0 0 6px" data-i18n="txTitle"></h3>
  <div style="font-size:12px;color:#666;margin-bottom:6px;line-height:1.5" data-i18n="txHint"></div>
  <label class="fld"><span data-i18n="tName"></span> <input id="tName"></label>
  <label class="fld"><span data-i18n="tAuthor"></span> <input id="tAuthor"></label>
  <label class="fld"><span data-i18n="tBy"></span> <input id="tBy"></label>
  <label class="fld">BPM <input id="tBpm" type="number" min="1"></label>
  <label class="fld"><span data-i18n="tMs"></span> <input id="tMs" type="number" min="1"></label>
  <label class="fld">bitsPerPage <input id="tBits" type="number" min="1"></label>
  <label class="fld"><span data-i18n="tPitch"></span> <input id="tPitch" type="number"></label>
  <label class="fld"><span data-i18n="tComposed"></span> <input id="tComposed" type="checkbox"></label>
  <label class="fld"><span data-i18n="tSeq"></span> <select id="tSeq"><option value="seq" data-i18n="tSeqSeq"></option><option value="flat" data-i18n="tSeqFlat"></option></select></label>
  <label class="fld"><span data-i18n="tEnc"></span> <select id="tEnc"><option value="8">UTF-8</option><option value="16" data-i18n="tEnc16"></option></select></label>
  <div style="text-align:right;margin-top:10px"><button id="tCancel" data-i18n="cancel"></button> <button id="tGo" data-i18n="export"></button></div>
</dialog>

<script>
// ================= 多語系 i18n：繁體中文 / English / Tiếng Việt / 日本語 =================
const LANGS={zh:0,en:1,vi:2,ja:3},LKEY='fangkuai-lang';
let curLang='zh';
try{curLang=localStorage.getItem(LKEY)}catch(e){}
if(!LANGS.hasOwnProperty(curLang)){
  const nv=(navigator.language||'').toLowerCase();
  curLang=nv.startsWith('ja')?'ja':nv.startsWith('vi')?'vi':nv.startsWith('zh')?'zh':'en';
}
// 每個詞條依序為 [繁中, English, Tiếng Việt, 日本語]

addRow:['＋ 向下新增一列','＋ Add a row below','＋ Thêm một hàng bên dưới','＋ 下に行を追加'],
rmRow:['刪除此列','Delete this row','Xóa hàng này','この行を削除'],
// 貼上對話框
ptTitle:['貼上譜文字（自動辨識格式）','Paste score text (format auto-detected)','Dán văn bản bản nhạc (tự nhận dạng định dạng)','譜面テキストを貼り付け（形式を自動判別）'],

const t=(k,...a)=>{

  let s=e[LANGS[curLang]];if(s==null)s=e[0];
  a.forEach((v,i)=>{s=s.split('{'+i+'}').join(v)});
  return s;
};

const W=5,H=3,KEY='fangkuai-score-v1';
let tool=1,cols=6,rows=[],painting=false,paintVal=1,meta=null;
const newBox=()=>Array(W*H).fill(0);
const newRow=()=>Array.from({length:cols},newBox);
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.rows){rows=s.rows;cols=s.cols;meta=s.meta||null}}catch(e){}
if(!rows.length)rows=[newRow(),newRow(),newRow(),newRow()];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({cols,rows,meta}))}catch(e){}};

function renderSq(){
  const sh=document.getElementById('sheet');sh.innerHTML='';
  rows.forEach((row,r)=>{
    const rd=document.createElement('div');rd.className='row';
    row.forEach((box,b)=>{
      const bd=document.createElement('div');bd.className='box';
      box.forEach((v,i)=>{
        const c=document.createElement('div');c.className='c';c.dataset.v=v;
        c.dataset.r=r;c.dataset.b=b;c.dataset.i=i;bd.appendChild(c);
      });
      rd.appendChild(bd);
    });
    const x=document.createElement('button');x.className='rm';x.textContent='✕';x.title=t('rmRow');
    x.onclick=()=>{if(rows.length>1){rows.splice(r,1);save();render()}};
    rd.appendChild(x);sh.appendChild(rd);
  });
  document.getElementById('cols').value=cols;
}
function apply(el,val){
  if(!el||!el.classList||!el.classList.contains('c'))return;
  const {r,b,i}=el.dataset;rows[r][b][i]=val;el.dataset.v=val;
}
const sheet=document.getElementById('sheet');
sheet.addEventListener('pointerdown',e=>{
  const el=e.target;if(!el.classList.contains('c'))return;
  painting=true;
  paintVal=(+el.dataset.v===tool)?0:tool;
  apply(el,paintVal);e.preventDefault();
});
sheet.addEventListener('pointermove',e=>{
  if(!painting)return;
  apply(document.elementFromPoint(e.clientX,e.clientY),paintVal);
});
addEventListener('pointerup',()=>{if(painting){painting=false;save()}});

function setTool(t){
  tool=t;
  document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('on',+b.dataset.t===t));
}
document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>setTool(+b.dataset.t));

  const m={'1':1,'2':2,'3':3,'4':0,'0':0};

setTool(1);

document.getElementById('addRow').onclick=()=>{rows.push(newRow());save();render()};
document.getElementById('clear').onclick = () => {
    if (!confirm(t('confClear'))) return;

    rows.forEach((row, index) => {
        rows[index] = newRow();
    });

    rows.splice(1);

    save();
    render();
};
document.getElementById('cols').onchange=e=>{
  const n=Math.max(1,Math.min(12,+e.target.value||6));
  if(n===cols){render();return}
  // 把所有方塊依序攤平，再依新的每列譜數重新排列（不丟棄、不產生多餘空白頁）
  const all=rows.flat();
  let last=-1;all.forEach((b,i)=>{if(b.some(v=>v))last=i});
  const keep=last>=0?all.slice(0,last+1):all.slice(0,n); // 去掉尾端多餘的空白方塊
  const nr=Math.max(1,Math.ceil(keep.length/n));
  rows=Array.from({length:nr},(_,r)=>Array.from({length:n},(_,c)=>keep[r*n+c]||newBox()));
  cols=n;save();render();
};

const COLORS=['#fff','#000','#f00','#1ba7e6'];
function drawCanvas(){
  const S=36,G=20,PAD=24,BW=W*S,BH=H*S;
  const cv=document.createElement('canvas');
  cv.width=PAD*2+cols*BW+(cols-1)*G;
  cv.height=PAD*2+rows.length*BH+(rows.length-1)*G;
  const g=cv.getContext('2d');
  g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);
  rows.forEach((row,r)=>row.forEach((box,b)=>{
    const ox=PAD+b*(BW+G),oy=PAD+r*(BH+G);
    g.fillStyle='#fff';g.fillRect(ox,oy,BW,BH);
    g.strokeStyle='#ddd';g.lineWidth=1;
    for(let i=1;i<W;i++){g.beginPath();g.moveTo(ox+i*S,oy);g.lineTo(ox+i*S,oy+BH);g.stroke()}
    for(let j=1;j<H;j++){g.beginPath();g.moveTo(ox,oy+j*S);g.lineTo(ox+BW,oy+j*S);g.stroke()}
    box.forEach((v,i)=>{
      if(!v)return;
      g.fillStyle=COLORS[v];g.fillRect(ox+(i%W)*S,oy+Math.floor(i/W)*S,S,S);
    });
    g.strokeStyle='#000';g.lineWidth=2;g.strokeRect(ox,oy,BW,BH);
  }));
  return cv;
}
function download(url,name){const a=document.createElement('a');a.href=url;a.download=name;a.click()}
document.getElementById('jpg').onclick=()=>download(drawCanvas().toDataURL('image/jpeg',0.95),t('fnSq')+'.jpg');
document.getElementById('pdf').onclick = () => {

    const { jsPDF } = window.jspdf;

    const ROWS_PER_PAGE = 80;

    const S = 36;
    const G = 20;
    const PAD = 24;

    const BW = W * S;
    const BH = H * S;

    const pageRows = [];

    for (let i = 0; i < rows.length; i += ROWS_PER_PAGE) {
        pageRows.push(rows.slice(i, i + ROWS_PER_PAGE));
    }

    if (pageRows.length === 0) return;

    let pdf = null;

    pageRows.forEach((pageData, pageIndex) => {

        const cv = document.createElement('canvas');

        cv.width =
            PAD * 2 +
            cols * BW +
            (cols - 1) * G;

        cv.height =
            PAD * 2 +
            pageData.length * BH +
            (pageData.length - 1) * G;

        const g = cv.getContext('2d');

        g.fillStyle = '#fff';
        g.fillRect(0, 0, cv.width, cv.height);

        pageData.forEach((row, r) => {

            row.forEach((box, b) => {

                const ox = PAD + b * (BW + G);
                const oy = PAD + r * (BH + G);

                g.fillStyle = '#fff';
                g.fillRect(ox, oy, BW, BH);

                g.strokeStyle = '#ddd';
                g.lineWidth = 1;

                for (let i = 1; i < W; i++) {
                    g.beginPath();
                    g.moveTo(ox + i * S, oy);
                    g.lineTo(ox + i * S, oy + BH);
                    g.stroke();
                }

                for (let j = 1; j < H; j++) {
                    g.beginPath();
                    g.moveTo(ox, oy + j * S);
                    g.lineTo(ox + BW, oy + j * S);
                    g.stroke();
                }

                box.forEach((v, i) => {

                    if (!v) return;

                    g.fillStyle = COLORS[v];

                    g.fillRect(
                        ox + (i % W) * S,
                        oy + Math.floor(i / W) * S,
                        S,
                        S
                    );

                });

                g.strokeStyle = '#000';
                g.lineWidth = 2;
                g.strokeRect(ox, oy, BW, BH);

            });

        });

        const img = cv.toDataURL('image/jpeg', 0.95);

        // 第一次先建立一個暫時頁面
        if (pageIndex === 0) {

            pdf = new jsPDF({
                orientation: 'p',
                unit: 'px',
                format: [10, 10]
            });

            // 刪掉 jsPDF 自動建立的第一頁
            pdf.deletePage(1);
        }

        // 每一頁都用相同方式新增自訂尺寸
        pdf.addPage(
            [cv.width, cv.height],
            'p'
        );

        pdf.addImage(
            img,
            'JPEG',
            0,
            0,
            cv.width,
            cv.height
        );

    });

    pdf.save(t('fnSq')+'.pdf');

};

const hasContent=()=>rows.some(r=>r.some(b=>b.some(v=>v)));
function fillBoxes(slots){
  if(hasContent()&&!confirm(t('confReplace')))return false;
  const n=Math.max(1,Math.ceil(slots.length/cols));
  rows=Array.from({length:n},newRow);
  slots.forEach((c,i)=>{rows[Math.floor(i/cols)][i%cols]=c});
  save();render();return true;
}
function readText(buf){
  const u=new Uint8Array(buf);let enc='utf-8';
  if(u[0]===0xFF&&u[1]===0xFE)enc='utf-16le';else if(u[0]===0xFE&&u[1]===0xFF)enc='utf-16be';
  return new TextDecoder(enc).decode(buf).replace(/^\uFEFF/,'');
}

const _SK=a=>a.map(v=>String.fromCharCode(v^0x5A)).join('');
const SKY_KEY=_SK([0x0E,0x18,0x76,0x08,0x7C,0x0B,0x27,0x77,0x0F,0x16,0x1C,0x02,0x1C,0x6D,0x67,0x21,0x34,0x0F,0x6D,0x2C,0x65,0x3C,0x23,0x79,0x11,0x32,0x28,0x63,0x17,0x32,0x2F,0x2F]);
const SKY_END=_SK([0x20,0x2E,0x18,0x05,0x31,0x3B,0x1C,0x3F,0x0B,0x3F,0x75,0x2D,0x3B,0x62,0x11,0x2B,0x21,0x28,0x05,0x30,0x20,0x7B,0x28,0x67,0x0A,0x07,0x73,0x32,0x0B,0x16,0x72,0x3C]);
function decryptSky(song){
  if(!Array.isArray(song.songNotes)||!song.songNotes.every(x=>typeof x==='number'))
    throw new Error(t('eSongNotes'));
  let s='';
  song.songNotes.forEach((v,i)=>{
    const c=v-SKY_KEY.charCodeAt(i%SKY_KEY.length)+100;
    s+=(c>=0&&c<0x110000)?String.fromCodePoint(c):'?';
  });
  const end=s.indexOf(SKY_END);if(end!==-1)s=s.slice(0,end);
  let notes;
  try{notes=JSON.parse(s)}catch(e){throw new Error(t('eDecrypt',song.keyVersion))}
  if(!Array.isArray(notes))throw new Error(t('eNotArr'));
  const out={...song,songNotes:notes,isEncrypted:false};delete out.keyVersion;
  return out;
}
function importAny(raw){
  const t=raw.replace(/^\s*```.*$/gm,'').trim();
  if(!t)throw new Error(t('eEmpty'));
  if(/^[\[{]/.test(t)){
    let d;try{d=JSON.parse(t)}catch(e){throw new Error(t('eJson'))}
    if(Array.isArray(d)&&d.length&&d.every(x=>typeof x==='number'))
      throw new Error(t('eNumArr'));
    if(Array.isArray(d))d=d[0];
    if(d&&d.isEncrypted){d=decryptSky(d);msg(t('decrypted',d.name||''))}
    if(!d)throw new Error(t('eUnknown'));
    if(!Array.isArray(d.songNotes))throw new Error(t('eNotSky'));
    sky=d;meta={name:d.name,author:d.author,transcribedBy:d.transcribedBy,isComposed:d.isComposed,bpm:d.bpm,bitsPerPage:d.bitsPerPage,pitchLevel:d.pitchLevel};$('unit').value='';convertSky();return;
  }
  const toks=t.split(/[\s|]+/).filter(Boolean);sky=null;
  const gridRe=/^(?:[.\-_]+|(?:[A-C][1-5])+)$/i;
  if(toks.filter(x=>gridRe.test(x)).length/toks.length>0.8){
    const slots=toks.map(x=>{
      const c=Array(15).fill(0);
      for(const m of x.matchAll(/([A-C])([1-5])/gi))c[(m[1].toUpperCase().charCodeAt(0)-65)*5+(+m[2]-1)]=1;
      return c;
    });
    if(fillBoxes(slots))msg(t('doneGrid',slots.length));
    return;
  }
  const jpRe=/^[0-7](?:'+|,+)?(?:\+[0-7](?:'+|,+)?)*$/,fmt=$('fmt').value;
  if(fmt==='jp'||(fmt==='auto'&&toks.every(x=>jpRe.test(x)))){
    const base=+$('base').value||0,bad=new Set(),slots=toks.map(tok=>{
      const c=Array(15).fill(0);
      tok.split('+').forEach(n=>{
        const x=/^([0-7])('*|,*)$/.exec(n);if(!x){bad.add(n);return}
        if(x[1]==='0')return;
        const o=x[2]?(x[2][0]==="'"?x[2].length:-x[2].length):0,i=base+(+x[1]-1)+7*o;
        if(i<0||i>14)bad.add(n);else c[i]=1;
      });
      return c;
    });
    if(fillBoxes(slots))msg(t('doneJp',slots.length)+(bad.size?t('badRange',[...bad].join(' ')):''));
    return;
  }
  // 數字＋字母
  const map={};
  $('letters').value.split(',').forEach(p=>{const [k,v]=p.split('=');if(k&&+v>0)map[k.trim().toLowerCase()]=+v});
  const slots=[],bad=new Set();let cur=null;
  const rest=n=>{for(let i=0;i<n;i++)slots.push(newBox())};
  toks.forEach(x=>{
    if(/^\d+$/.test(x)){
      const k=+x-1;if(k<0||k>14){bad.add(x);return}
      (cur=cur||Array(15).fill(0))[k]=1;
    }else if(/^[a-z]$/i.test(x)){
      const n=map[x.toLowerCase()];if(!n){bad.add(x);return}
      if(cur){slots.push(cur);rest(n-1);cur=null}else rest(n);
    }else bad.add(x);
  });
  if(cur)slots.push(cur);
  if(!slots.length)throw new Error(t('eNoFmt'));
  if(fillBoxes(slots))msg(t('done',slots.length)+(bad.size?t('badSkip',[...bad].join(' ')):''));
}
$('unit').onchange=()=>{if(sky)convertSky()};
['m1','m2','m3'].forEach(i=>$(i).onchange=()=>{if(sky)convertSky()});
function convertSky(){
  const notes=sky.songNotes;
  let unit=+$('unit').value;
  if(!unit){ // 自動：取相鄰時間差的眾數
    const ts=[...new Set(notes.map(n=>n.time))].sort((a,b)=>a-b),cnt={};
    for(let i=1;i<ts.length;i++){const d=ts[i]-ts[i-1];cnt[d]=(cnt[d]||0)+1}
    unit=+Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]||250;
    $('unit').value=unit;
  }
  const col=[0,+$('m1').value,+$('m2').value,+$('m3').value];
  const m={};let max=0;
  notes.forEach(n=>{
    const x=/^(\d)Key(\d+)$/.exec(n.key);if(!x)return;
    const k=+x[2];if(k>14)return;
    const s=Math.round(n.time/unit);max=Math.max(max,s);
    (m[s]=m[s]||Array(15).fill(0))[k]|=(+x[1]===1?1:2);
  });
  const slots=[];
  for(let s=0;s<=max;s++)slots.push(m[s]?m[s].map(v=>col[v]):newBox());
  if(fillBoxes(slots))msg(t('done',slots.length));
}

// ---- 方塊合併：連續方塊疊成 第1層黑 → 第2層紅 → 第3層藍 ----
$('mergeBtn').onclick=()=>{
  const all=rows.flat(),cnt=g=>g.reduce((a,v)=>a+v,0);
  if(!all.some(b=>b.some(v=>v))){msg(t('noMerge'));return}
  const out=[];let grp=[];
  const flush=()=>{
    if(!grp.length)return;
    const box=newBox();
    grp.forEach((g,li)=>g.forEach((on,i)=>{if(on)box[i]=li+1}));
    out.push(box);grp=[];
  };
  all.forEach(b=>{
    const s=b.map(v=>v?1:0); // 已有顏色的一律當黑色判斷
    if(!cnt(s)){flush();out.push(newBox());return} // 空白方塊(休止)不合併、原位保留
    const ok=grp.length<3
      &&!grp.some(g=>g.some((on,i)=>on&&s[i]))                 // 同一格不能重疊
      &&grp.filter(g=>cnt(g)>1).length+(cnt(s)>1?1:0)<=1;      // 最多只有一層是2鍵以上
    if(!ok)flush();
    grp.push(s);
  });
  flush();
  if(out.length>=all.length){msg(t('noMerge'));return}
  backup=JSON.stringify({cols,rows});
  rows=Array.from({length:Math.ceil(out.length/cols)},newRow);
  out.forEach((b,i)=>{rows[Math.floor(i/cols)][i%cols]=b});
  save();render();msg(t('merged',all.length,out.length));$('undoBtn').hidden=false;
};

$('tCancel').onclick=()=>$('tx').close();
$('tGo').onclick=()=>{
  const unit=+$('tMs').value>0?+$('tMs').value:260,seq=$('tSeq').value==='seq';
  const notes=[];let step=0;
  rows.flat().forEach(box=>{
    const cs=seq?[1,2,3].filter(c=>box.includes(c)):[0]; // 依顏色展開成先後；或整個方塊同時
    if(!cs.length){step++;return}
    cs.forEach(c=>{
      box.forEach((v,i)=>{if(v&&(!c||v===c))notes.push({time:Math.round(step*unit),key:'1Key'+i})});
      step++;
    });
  });
  $('tx').close();
  if(!notes.length){msg(t('noExport'));return}
  const song={
    name:$('tName').value.trim()||t('fnSq'),
    author:$('tAuthor').value.trim()||'Unknown',
    transcribedBy:$('tBy').value.trim()||'Unknown',
    isComposed:$('tComposed').checked,
    bpm:num($('tBpm').value,230),
    bitsPerPage:num($('tBits').value,16),
    pitchLevel:num($('tPitch').value,0),
    isEncrypted:false,
    songNotes:notes
  };
  const text=JSON.stringify([song]);
  let blob;
  if($('tEnc').value==='16'){
    const u=new Uint8Array(2+text.length*2);u[0]=0xFF;u[1]=0xFE;
    for(let i=0;i<text.length;i++){const c=text.charCodeAt(i);u[2+i*2]=c&255;u[3+i*2]=c>>8}
    blob=new Blob([u],{type:'text/plain'});
  }else blob=new Blob([text],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  download(url,song.name.replace(/[\\/:*?"<>|]/g,'_')+'.txt');
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  const {songNotes,isEncrypted,...rest}=song;meta=rest;save();
  msg(t('exported',notes.length));
};

// ---- 數字譜匯出 ----
const NSW=56,NLH=38,NPAD=30,NLB=22,NHD=14;
function numLayout(){
  const per=nst.per,rowN=per*nst.bpr,a=rows.flat();
  const tot=Math.ceil(Math.max(lastIdx(a)+1,1)/per)*per,nr=Math.ceil(tot/rowN);
  const rh=[];for(let r=0;r<nr;r++){let m=1;for(let i=r*rowN;i<Math.min((r+1)*rowN,tot);i++)m=Math.max(m,notesOf(a[i]).length);rh.push(NLB+NHD+m*NLH+14)}
  return {per,rowN,a,tot,nr,rh};
}
// 畫第 r0 ~ r1-1 列（預設全部）
function drawNumCanvas(r0=0,r1=Infinity){
  const SW=NSW,LH=NLH,PAD=NPAD,LB=NLB,HD=NHD,{per,rowN,a,tot,nr,rh}=numLayout();
  r1=Math.min(r1,nr);
  const cv=document.createElement('canvas');cv.width=PAD*2+rowN*SW;cv.height=PAD*2+rh.slice(r0,r1).reduce((x,y)=>x+y,0);
  const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);
  g.textAlign='center';g.textBaseline='middle';
  let y=PAD;
  for(let r=r0;r<r1;r++){
    const s=r*rowN,e=Math.min(s+rowN,tot);
    g.fillStyle='#666';g.font='14px sans-serif';g.textAlign='left';g.fillText('('+(Math.floor(s/per)+1)+')',PAD,y+8);g.textAlign='center';
    g.strokeStyle='#000';g.lineWidth=2;
    for(let i=s;i<=e;i++)if((i-s)%per===0||i===e){const x=PAD+(i-s)*SW;g.beginPath();g.moveTo(x,y+LB-4);g.lineTo(x,y+rh[r]-6);g.stroke()}
    for(let i=s;i<e;i++){
      const cx=PAD+(i-s)*SW+SW/2;
      notesOf(a[i]).forEach((n,j)=>{
        const cy=y+LB+HD+j*LH+LH/2;g.fillStyle=COLORS[n.v];g.font='bold 26px sans-serif';g.fillText(kLabel(n.k),cx,cy);
        if(nst.style==='dot'){const o=Math.floor(n.k/7);for(let d=0;d<o;d++){g.beginPath();g.arc(cx+(d-(o-1)/2)*8,cy-17,2.6,0,7);g.fill()}}
      });
    }
    y+=rh[r];
  }
  return cv;
}

let ac=null,master=null,pTimer=null,pPrev=null;
const SEMI=[0,2,4,5,7,9,11],PKEY='fangkuai-play-v1';
const keyFreq=(k,tr)=>261.63*2**((SEMI[k%7]+12*Math.floor(k/7)+tr)/12); // 1=C 時最低音為 C4
function initAudio(){
  if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
  if(ac.state==='suspended')ac.resume();
  if(!master){master=ac.createGain();master.gain.value=.45;
    const c=ac.createDynamicsCompressor();master.connect(c);c.connect(ac.destination)}
}
const ksCache={};
function ksBuf(f,damp,dur){ // Karplus-Strong 撥弦
  const key=f.toFixed(2)+'|'+damp;if(ksCache[key])return ksCache[key];
  const sr=ac.sampleRate,N=Math.max(2,Math.round(sr/f)),len=Math.floor(sr*dur),b=ac.createBuffer(1,len,sr),d=b.getChannelData(0);
  for(let i=0;i<N;i++)d[i]=Math.random()*2-1;
  for(let i=N;i<len;i++)d[i]=damp*.5*(d[i-N]+d[i-N+1]);
  return ksCache[key]=b;
}
function playNote(k,t,dur){
  const f=keyFreq(k,+$('pKey').value),inst=$('pInst').value,g=ac.createGain();let out=g;
  const osc=(type,fr,vol)=>{const o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.value=fr;v.gain.value=vol;o.connect(v);v.connect(g);return o};
  const vib=(o,hz,depth)=>{const l=ac.createOscillator(),lg=ac.createGain();l.frequency.value=hz;lg.gain.value=f*depth;l.connect(lg);lg.connect(o.frequency);return l};
  let os=[],end;
  if(inst==='guitar'||inst==='harp'){
    const s=ac.createBufferSource();s.buffer=ksBuf(f,inst==='harp'?.9985:.996,inst==='harp'?2.6:1.8);
    end=t+(inst==='harp'?2.6:1.8);g.gain.setValueAtTime(.9,t);g.gain.linearRampToValueAtTime(0,end);s.connect(g);s.start(t);
  }else if(inst==='violin'){
    const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=Math.min(3500,f*6);g.connect(lp);out=lp;
    const o=osc('sawtooth',f,.5);os=[o,vib(o,5.5,.007)];
    const hold=t+Math.max(dur,.35);end=hold+.25;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.4,t+.12);g.gain.setValueAtTime(.4,hold);g.gain.linearRampToValueAtTime(0,end);
  }else if(inst==='flute'){
    const o=osc('sine',f,1);os=[o,osc('sine',2*f,.15),vib(o,5,.004)];
    const hold=t+Math.max(dur,.3);end=hold+.15;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.5,t+.06);g.gain.setValueAtTime(.5,hold);g.gain.linearRampToValueAtTime(0,end);
  }else if(inst==='musicbox'){
    os=[osc('sine',f,1),osc('sine',3*f,.3),osc('sine',4*f,.15)];end=t+1.4;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.5,t+.003);g.gain.exponentialRampToValueAtTime(.001,end);
  }else{ // piano
    os=[osc('triangle',f,.6),osc('sine',2*f,.25),osc('sine',3*f,.1)];end=t+1.8;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.5,t+.005);g.gain.exponentialRampToValueAtTime(.001,end);
  }
  out.connect(master);os.forEach(o=>{o.start(t);o.stop(end+.05)});
}
function playSteps(from){ // 與 TXT 匯出一致：每個方塊依 黑→紅→藍 展開成先後
  const steps=[];
  rows.flat().forEach((box,bi)=>{
    if(bi<from)return;
    const cs=$('pSeq').checked?[1,2,3].filter(c=>box.includes(c)):[0];
    if(!cs.length){steps.push({bi,keys:[]});return}
    cs.forEach(c=>steps.push({bi,keys:box.map((v,i)=>v&&(!c||v===c)?i:-1).filter(i=>i>=0)}));
  });
  return steps;
}
function hlPlay(bi){
  if(pPrev)pPrev.classList.remove('playing');
  const list=mode==='num'?document.querySelectorAll('.nslot'):document.querySelectorAll('#sheet .box');
  pPrev=list[bi]||null;
  if(pPrev){pPrev.classList.add('playing');pPrev.scrollIntoView({block:'nearest',inline:'nearest'})}
}
function stopPlay(){
  clearInterval(pTimer);pTimer=null;
  if(pPrev){pPrev.classList.remove('playing');pPrev=null}
  if(master){const m=master;m.gain.setTargetAtTime(0,ac.currentTime,.03);setTimeout(()=>m.disconnect(),400);master=null}
  $('playBtn').textContent=t('play');
}
function startPlay(){
  initAudio();
  const steps=playSteps(mode==='num'?sel:0);
  if(!steps.some(s=>s.keys.length)){msg(t('noPlay'));return}
  const spd=+$('pSpd').value||1;
  const unit=((+$('unit').value||(meta&&meta.bpm>0?Math.round(60000/meta.bpm):260)))/spd/1000;
  const t0=ac.currentTime+.15;let i=0,cur=-1;
  $('playBtn').textContent=t('stop');
  pTimer=setInterval(()=>{
    while(i<steps.length&&t0+i*unit<ac.currentTime+.3){
      steps[i].keys.forEach(k=>playNote(k,t0+i*unit,unit));i++;
    }
    const c=Math.floor((ac.currentTime-t0)/unit);
    if(c!==cur&&c>=0&&c<steps.length){cur=c;hlPlay(steps[c].bi)}
    if(ac.currentTime>t0+steps.length*unit+.8)stopPlay();
  },40);
}
$('playBtn').onclick=()=>pTimer?stopPlay():startPlay();
function previewKey(k){initAudio();playNote(k,ac.currentTime+.01,.4)}
try{const p=JSON.parse(localStorage.getItem(PKEY));if(p){['pKey','pInst','pSpd'].forEach(id=>{if(p[id]!=null)$(id).value=p[id]});$('pSeq').checked=p.pSeq!==false}}catch(e){}
['pKey','pInst','pSpd','pSeq'].forEach(id=>$(id).onchange=()=>{
  try{localStorage.setItem(PKEY,JSON.stringify({pKey:$('pKey').value,pInst:$('pInst').value,pSpd:$('pSpd').value,pSeq:$('pSeq').checked}))}catch(e){}
});

applyLang();
render();
</script>
